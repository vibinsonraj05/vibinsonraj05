<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="80" viewBox="0 0 1000 80">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#00FF88" stroke-opacity="0.07" stroke-width="1"/></pattern>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00FF88" stop-opacity="0"/><stop offset="0.5" stop-color="#00FF88"/><stop offset="1" stop-color="#00F0FF" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1000" height="80" fill="#0A0F0D"/>
<rect width="1000" height="80" fill="url(#grid)"/>
<rect x="0" y="0" width="2" height="80" fill="#00FF88" opacity="0.55"/><rect x="998" y="0" width="2" height="80" fill="#00FF88" opacity="0.55"/>
<rect x="0" y="-40" width="1000" height="40" fill="#00FF88" opacity="0.04"><animate attributeName="y" from="-40" to="80" dur="6s" repeatCount="indefinite"/></rect>
<text x="34" y="46" font-family="'Fira Code','JetBrains Mono','Courier New',monospace" font-size="26" font-weight="700" fill="#00FF88" filter="url(#glow)">&gt;_ 05 // CONNECT</text>
<text x="966" y="44" font-family="'Fira Code','JetBrains Mono','Courier New',monospace" font-size="13" text-anchor="end" fill="#00F0FF">[ OPEN CHANNELS ]<animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/></text>
<rect x="34" y="62" width="932" height="2" fill="url(#fade)"/>
</svg>